<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 静态首屏 title：无法 import，字面与 src/utils/branding.js SSOT 同字面
         （票 #62 B1，「二所」补齐）——改动必须两侧同批（branding.test.mjs 锚锁）。 -->
    <title>FLAi-OS 二所工程智能体运行底座</title>
    <!-- JS 挂载前的极简首屏：只使用内联 HTML/CSS/SVG，零请求、零脚本、零假进度。
         品牌字面与 branding.js 同批锚锁；Vue mount 会原子替换 #app 内全部节点。 -->
    <style>
      body {
        margin: 0;
        background: #faf7f2;
      }
      .flai-boot {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 22px;
        padding: 32px;
        color: #2b2622;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .flai-boot__brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
      }
      .flai-boot__mark {
        display: inline-flex;
        width: 44px;
        height: 44px;
      }
      .flai-boot__mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .flai-boot__copy {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .flai-boot__name {
        font-size: 19px;
        letter-spacing: .2px;
      }
      .flai-boot__subtitle {
        margin-top: 3px;
        color: #83796f;
        font-size: 12px;
      }
      .flai-boot__skeleton {
        width: min(420px, 74vw);
        display: grid;
        gap: 10px;
      }
      .flai-boot__skeleton span {
        display: block;
        height: 9px;
        border-radius: 999px;
        background: #ece5db;
      }
      .flai-boot__skeleton span:nth-child(2) {
        width: 68%;
      }
      @media (max-width: 480px) {
        .flai-boot { padding: 24px; }
        .flai-boot__skeleton { width: min(300px, 78vw); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="flai-boot" role="status" aria-label="FLAi-OS 正在启动">
        <div class="flai-boot__brand">
          <span class="flai-boot__mark" aria-hidden="true">
            <svg viewBox="0 0 256 256" focusable="false">
              <defs>
                <path id="boot-bloom-petal" d="M131 23C125.3 21.3 121.2 23.3 117 25C112.8 26.7 109.7 27.2 106 33C102.3 38.8 96.5 50.2 95 60C93.5 69.8 94.2 82 97 92C99.8 102 109.3 118.7 112 120C114.7 121.3 111.3 106.8 113 100C114.7 93.2 118 85 122 79C126 73 130.7 68.3 137 64C143.3 59.7 157.7 57.8 160 53C162.3 48.2 155.8 40 151 35C146.2 30 136.7 24.7 131 23Z" />
              </defs>
              <g fill="#c66f55">
                <use href="#boot-bloom-petal" />
                <use href="#boot-bloom-petal" transform="rotate(60 127.6 127.6)" />
                <use href="#boot-bloom-petal" transform="rotate(120 127.6 127.6)" />
                <use href="#boot-bloom-petal" transform="rotate(180 127.6 127.6)" />
                <use href="#boot-bloom-petal" transform="rotate(240 127.6 127.6)" />
                <use href="#boot-bloom-petal" transform="rotate(300 127.6 127.6)" />
              </g>
              <path d="M126 113C123.5 113 121.8 113.8 120 115C118.2 116.2 116.2 117.7 115 120C113.8 122.3 113 126.5 113 129C113 131.5 113.8 133.2 115 135C116.2 136.8 117.5 138.8 120 140C122.5 141.2 127 142.3 130 142C133 141.7 136 140 138 138C140 136 141.3 132.2 142 130C142.7 127.8 142.3 126.7 142 125C141.7 123.3 141.2 121.7 140 120C138.8 118.3 137.3 116.2 135 115C132.7 113.8 128.5 113 126 113Z" fill="#a9513d" />
            </svg>
          </span>
          <span class="flai-boot__copy">
            <strong class="flai-boot__name">FLAi-OS</strong>
            <span class="flai-boot__subtitle">二所工程智能体运行底座</span>
          </span>
        </div>
        <div class="flai-boot__skeleton" aria-hidden="true">
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
