name: FLAi-OS CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flai-os-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: FLAi-OS / verify_all
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.6

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        run: uv run --no-project --with playwright==1.61.0 playwright install --with-deps chromium

      - name: Run the repository verification gate
        run: bash scripts/verify_all.sh
