                  <rect width="960" height="420" fill="#faf7f2"/>
                  <rect x="80" y="58" width="800" height="304" rx="12" fill="#ffffff" stroke="#ece5db"/>
                  <path d="M92 58h776a12 12 0 0 1 12 12v2H80v-2a12 12 0 0 1 12-12Z" fill="#ece5db"/>
                  <text x="120" y="116" fill="#a39d90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" letter-spacing="1.4">PROTOCOL CONTRACT FIXTURE · MOCK</text>
                  <rect x="692" y="92" width="148" height="34" rx="17" fill="#fdfcf9" stroke="#a8761a" stroke-opacity="0.45"/>
                  <circle cx="712" cy="109" r="4" fill="#a8761a"/>
