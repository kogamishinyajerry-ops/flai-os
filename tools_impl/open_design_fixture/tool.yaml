                  <text x="120" y="180" fill="#2b2622" font-family="Songti SC, STSong, serif" font-size="40" font-weight="600">Open Design 接缝契约夹具</text>
                  <text x="120" y="218" fill="#6b6259" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">machine-only · 非生产生成 · 非产品资产 · 非视觉 QA 结论</text>
                  <line x1="120" y1="252" x2="840" y2="252" stroke="#ece5db"/>
                  <text x="120" y="290" fill="#a39d90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">生成模式</text>
                  <text x="120" y="320" fill="#2b2622" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">fixture / mock</text>
                  <text x="378" y="290" fill="#a39d90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">发布影响</text>
                  <text x="378" y="320" fill="#2b2622" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">无 · contract only</text>
                  <text x="650" y="290" fill="#a39d90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">下一步</text>
                  <text x="650" y="320" fill="#c15f3c" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">审核协议证据 →</text>
                </svg>
          additionalProperties: false
      items: false
    error_message:
      type:
        - string
        - "null"
  additionalProperties: false
  allOf:
    - if:
        properties:
          status:
            const: success
      then:
        properties:
          fixture_sha256:
            const: 70be2a7428ab385eb85e57845133b6b457402c6421c15d338a7f0a1b6b9eefd8
          request_sha256:
            const: aab2740108a2d13aca53869f6c4c39b732a5ab3c2c3f3848f61bcb7915038f2c
          design_reference_package_sha256:
            const: 4fa241ae49d3c992168b2589779e24344749300a129e1f9478337974a3d68ca3
          design_reference_package:
            const: {"schema_version":"flai-design-reference-package/v1","sources":{"app_tokens":{"path":"frontend/src/App.vue","sha256":"b19bfd2fad7d66e6d02917f4e20d2e78c1ea30d48d836d5aed987ad0a5219ed7"},"motion_system":{"path":"docs/design/MOTION-SYSTEM.md","sha256":"8942f2d781e90b80af07fe61ac8697d9a3a6f7f46ce254d04ceadfa1b858bb9a"},"ui_paradigm":{"path":"docs/design/UI-PARADIGM.md","sha256":"6985d3ce38d9667d4a351c44499f0cd4685257adca956fb6475e0ca6247677b9"}},"theme":"light","token_allowlist":["--clay","--clay-deep","--ink","--ink-soft","--ink-faint","--page-bg","--card-bg","--paper-surface","--hairline","--trust-real","--trust-signed","--trust-fail","--trust-pending","--focus-ring-clay","--radius-sm","--radius-lg","--space-1","--space-2","--space-3","--space-4","--space-6","--shadow-card","--serif","--sans"],"tokens":{"--card-bg":"#ffffff","--clay":"#c15f3c","--clay-deep":"#a54e2f","--focus-ring-clay":"var(--clay)","--hairline":"#ece5db","--ink":"#2b2622","--ink-faint":"#a39d90","--ink-soft":"#6b6259","--page-bg":"#faf7f2","--paper-surface":"#fdfcf9","--radius-lg":"12px","--radius-sm":"6px","--sans":"\"PingFang SC\", \"Microsoft YaHei\", system-ui, -apple-system, sans-serif","--serif":"\"Iowan Old Style\", \"Palatino Linotype\", Palatino, \"Songti SC\", \"STSong\", \"Times New Roman\", serif","--shadow-card":"0 1px 2px rgba(43, 38, 34, 0.035), 0 4px 14px rgba(72, 58, 44, 0.05)","--space-1":"4px","--space-2":"8px","--space-3":"12px","--space-4":"16px","--space-6":"24px","--trust-fail":"#be3a3a","--trust-pending":"#a8761a","--trust-real":"#2e8f50","--trust-signed":"#167d8b"},"trust_color_constraints":{"--clay":"work_or_selected_only","--trust-fail":"true_failure_or_rejection_only","--trust-pending":"unverified_degraded_or_waiting_review_only","--trust-real":"real_evidence_only","--trust-signed":"human_signed_only","cancelled":"neutral_no_trust_color","completed":"neutral_no_trust_color","human_is_only_signer":true}}
          response_sha256:
