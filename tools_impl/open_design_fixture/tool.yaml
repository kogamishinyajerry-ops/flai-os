runtime:
  timeout_seconds: 10
  max_parallel_jobs: 1
  retry: 0
safety:
  require_workspace_isolation: false
  allow_shell_command: false
  save_raw_files: false
owner:
  maintainer: TBD
  business_owner: TBD
