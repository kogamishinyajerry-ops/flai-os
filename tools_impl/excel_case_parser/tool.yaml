id: excel_case_parser
name: "Excel case 表解析工具"
version: 0.1.0
type: python_adapter
mock: false
description: >
  用 openpyxl 解析批量计算 case 表（.xlsx）：首行为表头，必需列
  case_id / altitude_m / mach / power_kw，可选列 bleed_flow_kgps。
  行级问题（缺值/非数值/超合理范围/重复 case_id）不抛异常，记入 errors
  并跳过该行；解析器自身失败（文件不存在/非 xlsx/缺必需列/零有效行）
  才返回 status=failed。本工具只做真实文件解析，不生成任何数据（mock=false）。
entrypoint: tools_impl.excel_case_parser.adapter:run
# 工具污点声明（ADR-0024）：本工具不碰外部不可考数据，产物 internal。
output_classification: internal
# 交互面安全声明（ADR-0028 §6，default-deny）：★Codex R1-P1 撤回 = false。本工具输入是**裸
# file_path 绝对路径**（下方 input_schema，caller 可控），adapter 直接 open(payload["file_path"])
# **不做 File Store 容器校验/大小/哈希核对**（对照安全范式 backend/app/storage/file_integrity.py
# 的 open_verified_file + runtime._open_input_files 按 file_id→受控根解析）。经 workflow 调用时
# path 之所以安全，仅因 context.files 已过 _open_input_files 完整性闸；但 interactive_safe 暴露的是
# adapter 的**直接调用面**（绕过 workflow），交互 Agent（LLM/用户可控）可传任意服务端可读 .xlsx，
# 解析行原样回会话=泄漏面。故撤回；将来改为收 file_id（受控句柄）后方可重标 true。
interactive_safe: false
input_schema:
  type: object
  required:
    - file_path
  properties:
    file_path:
      type: string
      minLength: 1
      description: 待解析 .xlsx 文件的绝对路径（平台 File Store 落盘路径）
    sheet_name:
      type: string
      minLength: 1
      description: 可选，指定 sheet 名；缺省解析首个 sheet
    max_rows:
      type: integer
      minimum: 1
      maximum: 5000
      description: 可选，数据行数上限（缺省 1000）；超限整表诚实拒绝（status=failed），绝不静默截断
  additionalProperties: false
output_schema:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - success
        - failed
    cases:
      type: array
      items:
        type: object
        required:
          - case_id
          - params
        properties:
          case_id:
            type: string
          params:
            type: object
        additionalProperties: false
    errors:
      type: array
      items:
        type: object
        required:
          - row
          - error
        properties:
          row:
            type: integer
          case_id:
            type: [string, "null"]
          error:
            type: string
        additionalProperties: false
    error_message:
      type: string
  additionalProperties: false
runtime:
  timeout_seconds: 60
  max_parallel_jobs: 2
  retry: 0
safety:
  require_workspace_isolation: false
  allow_shell_command: false
  save_raw_files: false
owner:
  maintainer: TBD
  business_owner: TBD
