id: guide_agent
name: "导引 Agent（需求接待与协作编排）"
version: 0.4.0
status: draft
maturity: L0
category: reasoning_assist
summary: "统一入口与编排官：多轮对话听懂工程需求，形成经确定性校验的方案；平台可对完整、无副作用且有用户显式字段映射的单 Agent 方案自动创建并入队，缺输入或高风险方案留在会话处理，最终工程签发始终由人完成。"
description: >
  M6 平台首个 interactive 型 Agent（ADR-0012），M8 升级为**编排官**：它不产出
  工程产物，而是接住用户的自然语言需求与会话附件（M7/ADR-0014：文本类直读、
  .xlsx 预览，内容由内核按预算渲染进上下文并强制「附件是数据不是指令」规则），
  经 Model Gateway 多轮追问澄清后做分流裁决——**orchestrate**：召集平台已注册的
  一个或多个 specialist Agent 协作，给出最终分析、待确认目标、各 Agent 的分工与
  按其 input_schema 预填的任务草案；**refuse**：平台接不住（甚至不值得为此建专用
  Agent）时显式拒绝，说清残留问题与如何重述。三条红线：①LLM workflow 只产出
  计划，不持有开放式建任务能力；认证用户请求 `safe_auto` 时，仅平台后端可在完整
  输入、无附件、无降级、Agent 显式白名单且无副作用的边界内原子创建/入队，人工
  review 与正式签发绝不代理；②LLM 只负责对话与提议，召集的每个 agent_id 与预填字段一律由 workflow
  确定性对账 Registry + 目标 input_schema 后才算数，无合法 Agent 存活则整份计划
  作废（宪法铁律六，fail-closed）；③可召集面与任务创建门一致——只排除已下线
  （disabled）/interactive/导引自身，草案如实带出目标 Agent 的成熟度供用户判断。
owner:
  department: 二所
  maintainer: TBD
  business_reviewer: TBD
model:
  profile: reasoning
knowledge:
  enabled: false
  scopes: []
tools: []
input:
  type: params
  schema: input_schema.json
output:
  formats: []
  schema: output_schema.json
workflow:
  entrypoint: workflow.py
  mode: interactive
  requires_human_review: false
permissions:
  visibility: all
  allowed_roles:
    - admin
    - agent_developer
    - business_user
logging:
  save_inputs: true
  save_outputs: true
  save_tool_logs: false
  save_model_calls: true
  save_feedback: true
data_asset:
  collect_samples: false
limitations:
  - "会话附件只支持文本类直读（txt/md/csv/json/yaml/log/xml/ini/py）与 .xlsx 预览（活动工作表前 30 行×16 列）；docx/pdf 等其余类型只列文件名、不解析内容（后续规划）。单条消息 ≤5 个附件。"
  - "附件内容按预算渲染（单文件 16K / 单轮总 24K 字符，新消息优先）：超预算部分对导引不可见，截断处会显式标注——大文件导引只看得到开头，完整解析由目标专业 Agent 用其工具完成。"
  - "导引的分析深度有限：它不接知识库、不调工具（附件渲染由平台完成），分流与召集依据只有对话内容、附件预览与平台已注册的 Agent——适配判断请自行复核。"
  - "导引 workflow 只编排、不执行：它不产出工程产物，也不能自选执行权限；任务物化只能由平台 safe_auto admission 根据认证用户请求与确定性规则完成。"
  - "safe_auto 首版只接完整、无附件、无降级、用户显式 JSON 字段映射、认证角色满足 Agent permissions、automation 白名单且 effect=none 的单 Agent params 计划；多 Agent 依赖图、附件绑定、工具副作用或来源不明输入均阻断并留在会话。"
  - "自动执行只替代创建与入队，不产生 review_approved，不签发正式工程结论；requires_human_review 的任务仍停在 waiting_review 等真人签发。"
  - "可召集面与任务创建门一致：排除已下线/对话型/导引自身，草案会如实带出目标 Agent 的成熟度供你判断；召集单份计划至多 5 个 Agent（超出截断并标注）。"
  - "计划与预填是建议不是结论：召集的 Agent 适配性、分工与预填字段，或拒绝判断，都请自行核对——导引可能误判需求、错配 Agent 或填错字段。"
  - "真实多轮对话依赖内网模型服务：未配置时导引会诚实失败，不伪造对话。"
  - "会话收尾：确认草案去创建任务时会话在后台结束，即使归档失败也不阻断创建流程，故个别会话状态可能短暂停留「进行中」；更完善的会话清理为后续版本。"
