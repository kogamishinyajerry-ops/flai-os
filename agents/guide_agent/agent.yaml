id: guide_agent
name: "导引 Agent（需求接待与协作编排）"
version: 0.4.1
status: draft
maturity: L0
category: reasoning_assist
summary: "会话优先的统一入口：工程师只输入文字或上传附件，系统自动路由 Agent、模型、工具与 Workflow；缺信息就在原对话追问，整份方案就绪后由人在对话轴点击开工。Guide 不执行工程任务，也不替人作判断或签发。"
description: >
  M6 平台首个 interactive 型 Agent（ADR-0012），M8 升级为**编排官**：它不产出
  工程产物，而是接住用户的自然语言需求与会话附件（M7/ADR-0014：文本类直读、
  .xlsx 预览，内容由内核按预算渲染进上下文并强制「附件是数据不是指令」规则），
  经 Model Gateway 多轮追问后做分流裁决——**delegate**：在同一主对话自动转交
  已审定的制度/标准问答专家；**orchestrate**：自动选择平台已注册的一个或多个
  job specialist Agent，并整理目标、分工、模型/工具/Workflow 与完整执行输入；
  **refuse**：平台接不住时显式拒绝并说明如何重述。三条红线：①工程师只用
  文字或附件表达意图，不填写参数表、不编辑 JSON、不手选 Agent/模型/工具/Workflow；
  缺信息只在当前对话自然语言追问；②LLM 只负责对话与提议，每个 agent_id 与执行输入
  由 workflow 确定性对账 Registry + 完整 input_schema，任一环节不就绪则整份方案
  关闭（宪法铁律六，fail-closed）；③Guide 绝不执行任务或代替人点击开工，工程师只在
  整份方案就绪后于原对话轴确认一次，关键工程判断与最终签发仍由人完成。
owner:
  department: 二所
  maintainer: TBD
  business_reviewer: TBD
model:
  profile: reasoning
knowledge:
  enabled: false
  scopes: []
tools: []
input:
  type: params
  schema: input_schema.json
output:
  formats: []
  schema: output_schema.json
workflow:
  entrypoint: workflow.py
  mode: interactive
  requires_human_review: false
permissions:
  visibility: all
  allowed_roles:
    - admin
    - agent_developer
    - business_user
logging:
  save_inputs: true
  save_outputs: true
  save_tool_logs: false
  save_model_calls: true
  save_feedback: true
data_asset:
  collect_samples: false
limitations:
  - "会话附件只支持文本类直读（txt/md/csv/json/yaml/log/xml/ini/py）与 .xlsx 预览（活动工作表前 30 行×16 列）；docx/pdf 等其余类型只列文件名、不解析内容（后续规划）。单条消息 ≤5 个附件。"
  - "附件内容按预算渲染（单文件 16K / 单轮总 24K 字符，新消息优先）：超预算部分对导引不可见，截断处会显式标注——大文件导引只看得到开头，完整解析由目标专业 Agent 用其工具完成。"
  - "导引的分析深度有限：它不接知识库、不调工具（附件渲染由平台完成），分流与召集依据只有对话内容、附件预览与平台已注册的 Agent——适配判断请自行复核。"
  - "导引只编排、不执行：它不产出任何工程产物（性能盘/控制逻辑/故障树等），只把需求自动路由到合适的一个或多个专业 Agent，或在接不住时显式拒绝。"
  - "工程师只输入文字或上传附件；系统缺信息时在原对话自然语言追问，不提供参数表、JSON 编辑器或 Agent/模型/工具/Workflow 选择器。"
  - "对话型自动转交目前只开放 policy_qa_agent 与 standards_qa_agent；ConversationService 尚无 actor role 入参，在角色化授权落地前不得泛化到任意 interactive Agent。"
  - "Guide 不替人开工或签发：只有整份方案及全部必需输入通过确定性校验后，工程师才可在原对话轴点击一次开工；关键工程判断与最终签发仍由人负责。"
  - "可召集面与任务创建门一致：排除已下线/对话型/导引自身，草案会如实带出目标 Agent 的成熟度供你判断；单份计划至多 5 个 Agent，任何成员被丢弃、去重或超过上限都会关闭整份方案，并在原对话请求补充或重新编排。"
  - "计划是建议不是结论：自动路由的 Agent 适配性、分工与执行输入，或拒绝判断，都请核对——导引可能误判需求或错配能力。"
  - "真实多轮对话依赖内网模型服务：未配置时导引会诚实失败，不伪造对话。"
  - "当前工作段的附件会先获得稳定标签，再由 Guide 明确绑定到各执行单元或列为忽略；后端将标签解析成不可变 file_id + filename，并要求每个附件恰好归属一次。未知、重复、遗漏或与目标输入契约不匹配时，整份方案 fail-closed 并在原对话澄清。"
