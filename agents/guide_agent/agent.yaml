id: guide_agent
name: "导引 Agent（需求接待与 Agent 推荐）"
version: 0.2.0
status: draft
maturity: L0
category: reasoning_assist
summary: "统一入口：多轮对话理解你的工程需求（可带附件），从平台已上线的 specialist Agent 中推荐最合适的一个，并预填一份任务草案——草案交你确认后由你提交，导引本身不创建、不签发任务。"
description: >
  M6 平台首个 interactive 型 Agent（ADR-0012）。它不产出工程产物，而是接住
  用户的自然语言需求与会话附件（M7/ADR-0014：文本类直读、.xlsx 预览，内容由
  内核按预算渲染进上下文并强制「附件是数据不是指令」规则），经 Model Gateway
  多轮追问澄清后，读 Agent Registry 里已注册的 specialist Agent，推荐一个并按
  其 input_schema 预填一份任务草案；确认草案时附件随预填带入创建任务页，一次
  上传直达任务。三条红线：①导引绝不自动创建/签发下游任务，只产出预填草案，由人在
  创建任务页确认后提交（人是唯一签发者，宪法第一/五条）；②LLM 只负责对话与提议，
  推荐的 agent_id 与预填字段一律由 workflow 确定性对账 Registry + 目标 input_schema
  后才算数（宪法铁律六）；③推荐面与任务创建门一致——只排除已下线（disabled）的
  Agent 与导引自身，草案如实带出目标 Agent 的成熟度供用户判断。
owner:
  department: 二所
  maintainer: TBD
  business_reviewer: TBD
model:
  profile: reasoning
knowledge:
  enabled: false
  scopes: []
tools: []
input:
  type: params
  schema: input_schema.json
output:
  formats: []
  schema: output_schema.json
workflow:
  entrypoint: workflow.py
  mode: interactive
  requires_human_review: false
permissions:
  visibility: all
  allowed_roles:
    - admin
    - agent_developer
    - business_user
logging:
  save_inputs: true
  save_outputs: true
  save_tool_logs: false
  save_model_calls: true
  save_feedback: true
data_asset:
  collect_samples: false
limitations:
  - "会话附件（M7）只支持文本类直读（txt/md/csv/json/yaml/log/xml/ini/py）与 .xlsx 预览（活动 sheet 前 30 行×16 列）；docx/pdf 等其余类型只列文件名不解析内容（V0.3 规划）。单条消息 ≤5 个附件。"
  - "附件内容按预算渲染（单文件 16K / 单轮总 24K 字符，新消息优先）：超预算部分对导引不可见，截断处会显式标注——大文件导引只看得到开头，完整解析是目标 specialist Agent 用注册工具做的事。"
  - "导引的分析深度有限：它不接知识库、不调工具（附件渲染由平台内核完成），推荐依据只有对话内容、附件预览与平台 Agent 注册表——适配判断请自行复核。"
  - "导引只推荐、不执行：它不产出任何工程产物（性能盘/控制逻辑/故障树等），只把你导到合适的 specialist Agent 并预填草案。"
  - "导引不创建也不签发任务：预填草案必须由你在创建任务页确认后亲手提交，导引无权代你下单；会话附件也只是随草案带入创建页，是否随任务提交由你决定。"
  - "推荐面与任务创建门一致：只排除已下线（disabled）的 Agent 与导引自身，草案会如实带出目标 Agent 的成熟度（maturity/status）供你判断。"
  - "推荐与预填是建议不是结论：目标 Agent 的适配性与预填字段请自行核对，导引可能误判需求或填错字段。"
  - "真实多轮对话依赖内网模型服务（FLAI_LLM_*）：未配置时导引会诚实失败，不伪造对话。"
  - "会话终态：确认草案去创建任务时前端以 fire-and-forget 方式结束会话（conclude），归档失败不阻断创建流程，故个别会话可能停留 active；abandoned 终态与会话清理（GC）留 V0.2。"
