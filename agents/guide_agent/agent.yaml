id: guide_agent
name: "导引 Agent（需求接待与协作编排）"
version: 0.3.0
status: draft
maturity: L0
category: reasoning_assist
summary: "统一入口与编排官：多轮对话听懂你的工程需求（可带附件），分析后二选一——要么召集一组合适的 specialist Agent 协作并给出分工与预填草案，要么在平台接不住时显式拒绝并告诉你怎么重述才可行。计划交你确认，导引本身不创建、不召集、不签发任务。"
description: >
  M6 平台首个 interactive 型 Agent（ADR-0012），M8 升级为**编排官**：它不产出
  工程产物，而是接住用户的自然语言需求与会话附件（M7/ADR-0014：文本类直读、
  .xlsx 预览，内容由内核按预算渲染进上下文并强制「附件是数据不是指令」规则），
  经 Model Gateway 多轮追问澄清后做分流裁决——**orchestrate**：召集平台已注册的
  一个或多个 specialist Agent 协作，给出最终分析、待确认目标、各 Agent 的分工与
  按其 input_schema 预填的任务草案；**refuse**：平台接不住（甚至不值得为此建专用
  Agent）时显式拒绝，说清残留问题与如何重述。三条红线：①导引绝不自动创建/召集/
  签发下游任务，只产出预填草案，由人在下游确认后提交（人是唯一签发者，宪法第一/
  五条）；②LLM 只负责对话与提议，召集的每个 agent_id 与预填字段一律由 workflow
  确定性对账 Registry + 目标 input_schema 后才算数，无合法 Agent 存活则整份计划
  作废（宪法铁律六，fail-closed）；③可召集面与任务创建门一致——只排除已下线
  （disabled）/interactive/导引自身，草案如实带出目标 Agent 的成熟度供用户判断。
owner:
  department: 二所
  maintainer: TBD
  business_reviewer: TBD
model:
  profile: reasoning
knowledge:
  enabled: false
  scopes: []
tools: []
input:
  type: params
  schema: input_schema.json
output:
  formats: []
  schema: output_schema.json
workflow:
  entrypoint: workflow.py
  mode: interactive
  requires_human_review: false
permissions:
  visibility: all
  allowed_roles:
    - admin
    - agent_developer
    - business_user
logging:
  save_inputs: true
  save_outputs: true
  save_tool_logs: false
  save_model_calls: true
  save_feedback: true
data_asset:
  collect_samples: false
limitations:
  - "会话附件（M7）只支持文本类直读（txt/md/csv/json/yaml/log/xml/ini/py）与 .xlsx 预览（活动 sheet 前 30 行×16 列）；docx/pdf 等其余类型只列文件名不解析内容（V0.3 规划）。单条消息 ≤5 个附件。"
  - "附件内容按预算渲染（单文件 16K / 单轮总 24K 字符，新消息优先）：超预算部分对导引不可见，截断处会显式标注——大文件导引只看得到开头，完整解析是目标 specialist Agent 用注册工具做的事。"
  - "导引的分析深度有限：它不接知识库、不调工具（附件渲染由平台内核完成），分流与召集依据只有对话内容、附件预览与平台 Agent 注册表——适配判断请自行复核。"
  - "导引只编排、不执行：它不产出任何工程产物（性能盘/控制逻辑/故障树等），只把你的需求分流到合适的一个或多个 specialist Agent 并预填草案，或在接不住时显式拒绝。"
  - "导引不创建也不召集也不签发任务：计划里召集的每个 Agent 都要由你在下游确认后亲手提交任务，导引无权代你下单；会话附件也只是随草案带入创建页，是否随任务提交由你决定。"
  - "可召集面与任务创建门一致：排除已下线（disabled）/interactive/导引自身，草案会如实带出目标 Agent 的成熟度（maturity/status）供你判断；召集单份计划至多 5 个 Agent（超出截断并标注）。"
  - "计划与预填是建议不是结论：orchestrate 召集的 Agent 适配性、分工与预填字段，或 refuse 的拒绝判断，都请自行核对——导引可能误判需求、错配 Agent 或填错字段。"
  - "真实多轮对话依赖内网模型服务（FLAI_LLM_*）：未配置时导引会诚实失败，不伪造对话。"
  - "会话终态：确认草案去创建任务时前端以 fire-and-forget 方式结束会话（conclude），归档失败不阻断创建流程，故个别会话可能停留 active；abandoned 终态与会话清理（GC）留 V0.2。"
