# 资产清单 SSOT —— 需求接件评估的「家底感知」数据源（ADR-0028）
#
# 维护纪律：
# - 本文件是 requirement_intake_agent 做资产覆盖判定的唯一数据源；不在此
#   清单里的资产，评估时一律视为不存在（default-deny 精神：宁可漏报已有
#   资产被人工纠正，不可让 LLM 凭记忆编造家底）。
# - status 必须如实（宪法第五条：mock 冒充真实是唯一死罪）：
#     live      = 已上线/生产在用（有真实用户在用）
#     validated = 真实任务验证过，未常态化落岗
#     demo      = 演示件（mock/占位数据，链路可看不可信）
#     scaffold  = 链路真、数据假（如合成语料）
#     planned   = 仅规划，未动工
# - honest_note 写清该资产「不能说成什么」——它会随初筛结果注入评估
#   prompt，是对模型的强制诚实约束。
# - 涉外供应商产品一律泛化表述（如「国外供应商性能盘」），本文件会进
#   LLM 上下文与评估卡，商密红线与上屏材料同级。
# - 更新时机：新资产落地 / 状态跃迁（demo→validated→live）/ 季度盘点。
#   updated 字段随手改，评估卡会带出清单版期供人核对新鲜度。

